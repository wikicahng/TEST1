<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="VROID 虛擬角色、服裝與背景設計作品集">
  <title>VROID DESIGN ARCHIVE</title>
  <link rel="stylesheet" href="css/style.css?v=2.0.0">
</head>
<body>
  <div class="app-shell">
    <header class="top-panel">
      <a class="brand" href="#home" aria-label="回首頁">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-copy">
          <strong>VROID DESIGN</strong>
          <small>VISUAL ARCHIVE / V2</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="主要導覽">
        <button class="nav-button is-active" type="button" data-page="home">
          <span class="button-index">01</span><span>回首頁</span>
        </button>
        <button class="nav-button" type="button" data-page="background">
          <span class="button-index">02</span><span>VROID背景設計</span>
        </button>
        <button class="nav-button" type="button" data-page="character">
          <span class="button-index">03</span><span>VROID角色&amp;衣服設計</span>
        </button>
        
        <button class="nav-button" type="button" data-page="face">
          <span class="button-index">04</span><span>眼睛與牙齒</span>
        </button>
      </nav>
    </header>

    <main class="content-panel">
      <section class="page page-home is-visible" id="home" data-page-panel="home">
        <img class="full-bg" src="assets/solar-system.png" alt="">
        <div class="visual-overlay"></div>
        <div class="home-grid"></div>
        <div class="home-content">
          <p class="eyebrow">VIRTUAL CREATION PORTFOLIO</p>
          <h1>WELCOME</h1>
          <p class="intro">探索 VROID 虛擬角色、服裝與主播背景的設計紀錄。</p>
          <button class="primary-action" type="button" data-jump="background">
            <span>ENTER ARCHIVE</span><span aria-hidden="true">↗</span>
          </button>
        </div>
      </section>

      <section class="page carousel-page" id="background" data-page-panel="background" hidden>
        <div class="loading-state" data-loading="background">作品載入中…</div>
        <div class="project-carousel" data-carousel="background" hidden></div>
      </section>

      <section class="page carousel-page" id="character" data-page-panel="character" hidden>
        <div class="loading-state" data-loading="character">作品載入中…</div>
        <div class="project-carousel" data-carousel="character" hidden></div>
      </section>

      <section class="page carousel-page" id="face" data-page-panel="face" hidden>
        <div class="loading-state" data-loading="face">作品載入中…</div>
        <div class="project-carousel" data-carousel="face" hidden></div>
      </section>
      
    </main>
  </div>

  <div class="media-lightbox" id="mediaLightbox" aria-hidden="true" role="dialog"
       aria-modal="true" aria-label="作品全螢幕檢視">
    <div class="lightbox-toolbar">
      <button type="button" data-lightbox-zoom-out aria-label="縮小">−</button>
      <span class="lightbox-scale" data-lightbox-scale>100%</span>
      <button type="button" data-lightbox-zoom-in aria-label="放大">＋</button>
      <button type="button" data-lightbox-reset aria-label="恢復原始大小">RESET</button>
    </div>
    <button class="lightbox-close" type="button" data-lightbox-close aria-label="關閉">×</button>
    <div class="lightbox-stage" data-lightbox-stage>
      <div class="lightbox-media" data-lightbox-media></div>
    </div>
  </div>

  <noscript>此網站需要啟用 JavaScript 才能顯示作品。</noscript>
  <script type="module" src="js/main.js?v=2.0.0"></script>
</body>
</html>
